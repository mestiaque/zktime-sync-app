name: Build ZKTime Sync Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyzk requests tkcalendar
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Set version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          else { $v = "0.0.${{ github.run_number }}-dev" }
          "APP_VERSION = `"$v`"" | Set-Content -Encoding utf8 version.py
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building version $v"

      - name: Build EXE
        shell: pwsh
        run: |
          if (Test-Path "dist") { Remove-Item -Recurse -Force dist }
          if (Test-Path "build") { Remove-Item -Recurse -Force build }
          mkdir build
          pyinstaller --onefile --noconsole --name ZKTimeSync `
            --icon app_icon.ico `
            --hidden-import=zk `
            --hidden-import=requests `
            --hidden-import=babel.numbers `
            --collect-data=babel `
            --collect-data=tkcalendar `
            app.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build Installer
        shell: pwsh
        run: |
          $iv = ($env:VERSION -split "-")[0]
          iscc "/DMyAppVersion=$iv" ZKTimeSync.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ZKTimeSyncInstaller
          path: Output/ZKTimeSyncInstaller.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Output/ZKTimeSyncInstaller.exe
          name: ZKTime Sync ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
